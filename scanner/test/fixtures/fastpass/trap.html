<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>FastPass: keyboard trap</title>
  <style>:focus-visible { outline: 3px solid #000; }</style>
</head>
<body>
  <main>
    <h1>Keyboard trap</h1>
    <a href="#before">Before the widget</a>
    <div id="widget">
      <label for="one">One</label> <input id="one">
      <label for="two">Two</label> <input id="two">
    </div>
    <a href="#after">After the widget (unreachable)</a>
  </main>
  <script>
    // 2.1.2 failure: once inside, Tab, Shift+Tab and Escape all keep focus in the widget.
    const one = document.getElementById("one"), two = document.getElementById("two");
    document.addEventListener("keydown", (e) => {
      if (e.key !== "Tab" || !document.getElementById("widget").contains(document.activeElement)) return;
      e.preventDefault();
      (document.activeElement === one ? two : one).focus();
    });
  </script>
</body>
</html>
